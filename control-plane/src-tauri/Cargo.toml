[package]
name = "light-dex-control-plane"
default-run = "light-dex-control-plane"
version = "0.1.0"
description = "Control plane for Light DEX"
edition = "2024"

[lib]
name = "light_dex_control_plane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rand = "0.9"
sha2 = "0.11"
ts-rs = "12.0.1"
tungstenite = { version = "0.30", features = ["native-tls"] }

light_dex = { path = "../.." }
ed25519-dalek = "3.0.0"
