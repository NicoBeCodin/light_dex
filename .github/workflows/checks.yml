name: Checks

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo fmt --all --manifest-path market-data-hub/Cargo.toml --check
      - run: cargo test --locked
      - run: cargo test --locked --test persistent_validator -- --ignored
      - run: cargo test --locked --manifest-path protocol-codec/Cargo.toml
      - run: python3 -m py_compile hosted/*.py
      - run: cargo test --locked --manifest-path market-data-hub/Cargo.toml

  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: node --test hosted/*.test.mjs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: control-plane/src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: control-plane
      - run: npm run build
        working-directory: control-plane
      - run: cargo fmt --all --manifest-path control-plane/src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path control-plane/src-tauri/Cargo.toml --lib
