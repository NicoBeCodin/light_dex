[package]
name = "light_dex"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = {version= "1", features= ["derive"]}
serde_json = "1.0.151"

sha2 = "0.11.0"
hmac = "0.13"
base64 = "0.22"
zstd = "0.14"
rand = "0.9"
im = "15.1.0"
ed25519-dalek = "3.0.0"

ts-rs = "12.0.1"
tungstenite = { version = "0.30", features = ["native-tls"] }
toml = "0.9"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
